# Downloads the SA Valuer-General "Metropolitan Median House Sales" files from data.sa.gov.au.
# When a new quarter appears it regenerates suburb prices, rebuilds the public site (index.html) and commits.
# The Claude-hosted version of the app is updated separately from src/artifact.html.
name: Fetch Valuer-General house prices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 1"   # every Tuesday 8:47 am Adelaide time; only commits when something changes
  push:
    paths:
      - ".github/workflows/fetch-prices.yml"
      - "src/data/fetch_vg.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl xlrd
      - run: python src/data/fetch_vg.py
      - name: Rebuild app and public site if prices changed
        run: |
          if git diff --quiet -- src/data/raw && [ -z "$(git ls-files --others --exclude-standard src/data/raw)" ]; then echo "No new quarter"; exit 0; fi
          python src/data/refresh.py
          mkdir -p /tmp/libs/jspdf-src/dist /tmp/libs/qrlib
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o /tmp/libs/jspdf-src/dist/jspdf.umd.min.js
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js -o /tmp/libs/qrlib/qrcode.min.js
          python src/standalone/build.py /tmp/libs src/artifact.html index.html
      - name: Commit
        run: |
          git config user.name "suburb-fit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data index.html src/artifact.html
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Update house prices from the Valuer-General" && git push; fi
