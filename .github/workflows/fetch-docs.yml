# Downloads the public documents listed in src/data/doc_urls.txt (council rates, Gazette notices) as text.
name: Fetch reference documents
on:
  workflow_dispatch:
  push:
    paths:
      - "src/data/doc_urls.txt"
      - "src/data/fetch_docs.py"
      - ".github/workflows/fetch-docs.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 src/data/fetch_docs.py
      - run: |
          git config user.name "suburb-fit-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase origin main || true
          git add src/data/docs
          git diff --cached --quiet || (git commit -m "Update reference documents" && git push)
